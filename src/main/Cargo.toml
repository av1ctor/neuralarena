[package]
name = "main"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
candid = "0.9.11"
ic-cdk = "0.11.3"
ic-cdk-timers = "0.5.1"
serde = "1.0.190"
serde_json = "1.0.108"
rmp-serde = "1.1.2"
rand = "0.8.5"
ulid = {version = "1.0.0", features = [], default-features = false}
bot-engine = {version = "0.1.0", path = "../../../bot-engine"}

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["custom"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = { version = "0.2" }